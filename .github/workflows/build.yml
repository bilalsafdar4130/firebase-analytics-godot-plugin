name: build

# WHAT CI CAN AND CANNOT PROVE HERE.
#
# It runs the headless GDScript tests and it builds all six Android AARs from
# source. It does NOT build the iOS plugins: those are static libraries compiled
# against the engine's own C++ headers with Xcode, which needs macOS. That gap is
# documented in docs/ios.md rather than papered over — the iOS native half is
# marked preview for exactly this reason.

on:
  # `pull_request` already covers every branch that has one open, so `push` is
  # narrowed to the trunk and to tags. Both together started two identical runs
  # for every commit on a PR branch — and the Android job is not cheap.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new commit makes the run before it irrelevant. Without this they queue up
# behind each other and the answer you want arrives last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the version games export with; the plugins compile against the
  # engine library from THIS version's Android build template.
  GODOT_VERSION: "4.4.1"
  GODOT_RELEASE: "stable"

jobs:
  tests:
    name: headless tests
    runs-on: ubuntu-latest
    # Godot downloads in seconds and the tests run in one. Anything past this is
    # a hang, and a hang that is allowed to run is billed like work.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download"
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip \
            "$BASE/$TAG/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${TAG}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import the project
        # The first import always reports errors for resources that do not exist
        # yet, and exits non-zero on some versions. The run that matters is the
        # second one, and the test run after it.
        run: |
          timeout 300 godot --headless --import || true
          timeout 300 godot --headless --import

      - name: Check every script compiles
        # `run_tests.gd` only compiles what it reaches. Everything under
        # examples/ and demo/ is what a developer copies into their own game, so
        # a parse error there is one handed straight to somebody else.
        run: |
          set -o pipefail
          timeout 300 godot --headless --script res://tests/check_scripts.gd 2>&1 | tee compile-output.log
          if grep -qE '^(SCRIPT )?ERROR:' compile-output.log; then
            echo "::error::At least one script failed to compile."
            exit 1
          fi

      - name: Run the tests
        # GODOT LOGS A PARSE ERROR AND CARRIES ON, so `run_tests.gd` can exit 0
        # while half the SDK failed to compile — which is exactly what happened
        # the first time this workflow ran. A green job that hides a broken
        # build is worse than a red one, so the output is checked as well as the
        # exit code.
        #
        # The autoload starts during this run, so a script error anywhere in the
        # SDK surfaces here even though the tests themselves only exercise the
        # pure half.
        run: |
          set -o pipefail
          timeout 300 godot --headless --script res://tests/run_tests.gd 2>&1 | tee test-output.log
          if grep -qE '^(SCRIPT )?ERROR:' test-output.log; then
            echo "::error::Godot logged script errors — the SDK does not compile cleanly."
            grep -nE '^(SCRIPT )?ERROR:' -A 1 test-output.log
            exit 1
          fi

  android:
    name: android plugins
    runs-on: ubuntu-latest
    # Gradle fetching AGP, Kotlin and five SDKs from cold runs to about ten
    # minutes. Twice that is a hang, not a slow build — and the step that hung
    # before this ceiling existed ran until the runner's own limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the SDK platform the modules compile against
        # `compileSdk` in android/build.gradle.kts. AGP can download it itself,
        # but only sometimes and never predictably — an explicit install turns
        # "the build failed on a fresh runner" into a step with a name.
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          sdkmanager --list_installed | grep -E 'platforms;android-34|build-tools;34'

      - name: Install Godot and its export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download"
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$BASE/$TAG/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${TAG}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          curl -fsSL -o templates.tpz \
            "$BASE/$TAG/Godot_v${TAG}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Install the Android build template
        # DONE BY HAND, NOT BY THE EDITOR. `godot --headless
        # --install-android-build-template` hung indefinitely on this runner —
        # it starts the editor, and a headless editor with nothing to draw to
        # does not reliably reach the point where the tool runs and quits.
        #
        # The operation it performs is not complicated: unzip `android_source.zip`
        # out of the installed export templates into `res://android/build`, and
        # drop the .gdignore files that keep the engine from importing a Gradle
        # project as game assets. Doing it directly takes two seconds and cannot
        # hang.
        #
        # The plugins compile against the ENGINE'S OWN library out of that
        # template, which is why there is no `org.godotengine:godot` Maven
        # version pinned anywhere in this repository.
        run: |
          set -euo pipefail
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          test -f "$TEMPLATES/android_source.zip" || {
            echo "::error::android_source.zip is not in $TEMPLATES"
            ls -la "$TEMPLATES" || true
            exit 1
          }
          mkdir -p android/build
          unzip -q -o "$TEMPLATES/android_source.zip" -d android/build
          : > android/.gdignore
          : > android/build/.gdignore
          test -f android/build/gradlew || {
            echo "::error::no gradlew in the unpacked build template"
            find android/build -maxdepth 2 | head -50
            exit 1
          }
          # The build script needs the engine library. Report what is actually
          # there if it is somewhere else, so one run answers the question
          # instead of a guess.
          echo "engine libraries in the template:"
          find android/build -name '*.aar' | sed 's/^/  /'

      - name: Build every module
        run: |
          chmod +x addons/mobile_services/tools/build_android.sh
          addons/mobile_services/tools/build_android.sh both

      - name: Check every module produced an AAR
        run: |
          set -euo pipefail
          for variant in debug release; do
            for module in core firebase ads billing playgames consent; do
              aar="addons/mobile_services/bin/android/$variant/mobile-services-$module-$variant.aar"
              test -f "$aar" || { echo "missing $aar"; exit 1; }
              echo "ok $aar ($(stat -c%s "$aar") bytes)"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-aars
          path: addons/mobile_services/bin/android/
          if-no-files-found: error

      - name: Attach the AARs to the release
        # A game should depend on a released tag rather than on main; this is
        # what makes that possible without committing binaries to the repository.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: addons/mobile_services/bin/android/release/*.aar
          fail_on_unmatched_files: true
