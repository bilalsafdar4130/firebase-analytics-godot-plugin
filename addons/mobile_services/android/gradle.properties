# REQUIRED, not tuning. The Firebase, Play Billing, Play Games and AppLovin SDKs
# these modules compile against pull AndroidX in transitively, and AGP refuses
# to compile a module whose classpath contains AndroidX while this flag is
# unset:
#
#   Configuration `:debugCompileClasspath` contains AndroidX dependencies, but
#   the `android.useAndroidX` property is not enabled
#
# The bridges themselves import almost nothing from AndroidX. This is about what
# the SDKs drag along, and it is the same setting Godot's own Android build
# template carries for the same reason.
android.useAndroidX=true

# Nothing here needs Jetifier: every dependency in the graph is already AndroidX
# or has no support-library ancestry at all. Stated rather than left to the
# default, because turning it on silently doubles build time rewriting bytecode
# nobody in this project has.
android.enableJetifier=false

# The build runs inside CI containers with modest memory. Compiling six small
# modules does not need more, and pinning it keeps the daemon from sizing itself
# off whatever the host happens to have.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Six independent modules with no dependencies between them at the task level
# (only compileOnly on :core) parallelise cleanly.
org.gradle.parallel=true
org.gradle.caching=true
