[plugin]

name="Mobile Services"
description="A universal Android/iOS services SDK for Godot 4 games: Firebase Analytics, Crashlytics and Remote Config; AdMob and AppLovin MAX behind one placement-based ad API; Google Play Billing and StoreKit purchases with entitlements and subscriptions; a stable player identity with Play Games and Game Center; and Google UMP consent. Native sources included and built from this folder — no downloaded plugin binaries. Configure per game in mobile_services.cfg; the addon itself is identical in every project."
author="Bilal Safdar"
version="2.0.0"
script="mobile_services_editor_plugin.gd"
