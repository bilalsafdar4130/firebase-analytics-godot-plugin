# REQUIRED, not tuning. The Firebase SDK this bridge compiles against pulls
# AndroidX in transitively (play-services-measurement → androidx.core,
# androidx.collection, androidx.fragment and a dozen more), and AGP refuses to
# compile a module whose classpath contains AndroidX while this flag is unset:
#
#   Configuration `:debugCompileClasspath` contains AndroidX dependencies, but
#   the `android.useAndroidX` property is not enabled
#
# The bridge itself imports nothing from AndroidX. This is purely about what
# Firebase drags along, and it is the same setting Godot's own Android build
# template carries for the same reason.
android.useAndroidX=true

# Nothing here needs Jetifier: every dependency in the graph is already AndroidX
# or has no support-library ancestry at all. Stated rather than left to the
# default, because turning it on silently doubles build time rewriting
# bytecode nobody in this project has.
android.enableJetifier=false

# The build runs inside CI containers with modest memory. Kotlin compilation of
# a handful of files does not need more than this, and pinning it keeps the
# daemon from sizing itself off whatever the host happens to have.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
